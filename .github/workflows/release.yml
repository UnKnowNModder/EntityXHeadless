name: server build release

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
    - name: checkout the repo
      uses: actions/checkout@v4

    - name: installation.
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt install python3-pip python3.13-dev python3.13-venv libopenal-dev libsdl3-dev libvorbis-dev cmake clang-format rsync

    - name: build
      run: CMAKE_BUILD_TYPE=Release make cmake-server-build
    
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: server-builds
        path: build/cmake/server-release/staged